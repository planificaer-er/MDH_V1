  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F1F4ED; }
    .btn { transition: all .15s ease; cursor: pointer; border: none; outline: none; font-family: inherit; }
    .btn:hover { transform: translateY(-1px); }
    @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .fade { animation: fade .4s ease both; }

    /* ── Responsive ─────────────────────────────────────────── */
    .kpi-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
    .kpi-grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
    .kpi-grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:16px; }
    .main-pad   { padding:24px 28px 36px; }

    @media (max-width: 900px) {
      .kpi-grid-3 { grid-template-columns:repeat(2,1fr) !important; }
      .kpi-grid-4 { grid-template-columns:repeat(2,1fr) !important; }
    }
    @media (max-width: 640px) {
      .kpi-grid-3, .kpi-grid-4, .kpi-grid-2 { grid-template-columns:1fr !important; }
      .main-pad   { padding:14px 14px 28px !important; }
      .header-brand { gap:10px !important; }
      .header-brand img { height:32px !important; }
      .header-min { display:none !important; }
      .temporal-band { padding:6px 14px !important; gap:10px !important; }
      .temporal-band .temporal-hint { display:none !important; }
      .resumen-row { flex-wrap:wrap !important; gap:8px !important; }
      .resumen-row .resumen-monto { width:100% !important; justify-content:flex-end !important; }
      .nav-bar { padding:10px 14px !important; gap:8px !important; }
      .nav-bar h1 { font-size:15px !important; }
      .chart-container { height:220px !important; }
      .reporte-prog-row { flex-wrap:wrap !important; gap:8px !important; padding:10px 14px !important; }
      .prog-badge { flex-shrink:0 !important; }
    }
    @media (max-width: 420px) {
      .kpi-grid-3, .kpi-grid-4, .kpi-grid-2 { grid-template-columns:1fr !important; gap:8px !important; }
      .main-pad   { padding:10px 10px 24px !important; }
    }

/* ── Utilidades de parseo ────────────────────────────────────────────────── */
function slugify(s) {
  return s.toLowerCase()
    .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i")
    .replace(/ó/g,"o").replace(/ú/g,"u").replace(/ñ/g,"n")
    .replace(/[^a-z0-9]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
}

var MES_NORM = {
  "enero":0,"febrero":1,"marzo":2,"abril":3,"mayo":4,"junio":5,
  "julio":6,"agosto":7,"septiembre":8,"octubre":9,"noviembre":10,"diciembre":11,
  "mar":2,"abr":3,"may":4,"jun":5,"jul":6,"ago":7,"sep":8,"oct":9,"nov":10,"dic":11
};

function normMes(h) {
  if (!h) return -1;
  var tok = String(h).trim().toLowerCase()
    .replace(/[^a-záéíóú]/g,"").replace(/á/g,"a").replace(/é/g,"e")
    .replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u");
  return MES_NORM[tok] != null ? MES_NORM[tok] : -1;
}

/* Parsea valores numéricos del Excel: números, null, "-", "$80.000.000,00", "205.000.000,00" */
function parsearValor(v) {
  if (v === null || v === undefined || v === "-") return 0;
  if (typeof v === "number") return v < 0 ? 0 : v;
  var s = String(v).trim().replace(/\$/g,"").replace(/\s/g,"");
  if (/\d/.test(s)) {
    // formato argentino: 1.000.000,00 → quitar puntos de miles, coma→punto decimal
    s = s.replace(/\./g,"").replace(/,/g,".");
    var n = parseFloat(s);
    return isNaN(n) || n < 0 ? 0 : n;
  }
  return 0;
}

/* Normaliza nombres de programas: fusiona variantes en un nombre canónico */
function normProg(p) {
  if (!p) return p;
  // Fortalecer 2025/2026 → Fortalecer
  if (p.toLowerCase().startsWith('fortalecer')) return 'Fortalecer';
  // Poder Popular 2025/2026 → Poder Popular
  if (p.toLowerCase().startsWith('poder popular')) return 'Poder Popular';
  // Contigo (fusionar si se necesita)
  return p;
}

/* ── Parser de PLAN B para gráficos (usa cols mensuales de PLAN B) ────────── */
function parsePlanBForChart(buf) {
  var wb = XLSX.read(buf, {type:"array"});
  var ws = wb.Sheets['PLAN B'];
  if (!ws) return null;
  var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  // Fila 3 = encabezados; filas 4+ = datos
  // col 0=Area, col 1=Programa, cols 12-23 = Ene-Dic
  var byDim = {};
  rows.slice(4).forEach(function(row) {
    if (!row[0] || !row[1]) return;
    var areaRaw = String(row[0]).trim().toLowerCase()
      .replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u');
    var dimKey = DIMMAP[areaRaw];
    if (!dimKey) return;
    var prog = normProg(String(row[1]).trim());
    if (!prog || prog === 'Programa') return;
    // Leer valores mensuales (cols 12-23)
    var hasDato = false;
    for (var m = 0; m < 12; m++) {
      var v = parsearValor(row[12 + m]);
      if (v > 0) { hasDato = true; break; }
    }
    if (!hasDato) return; // excluir programas sin dato mensual
    if (!byDim[dimKey]) byDim[dimKey] = {};
    if (!byDim[dimKey][prog]) byDim[dimKey][prog] = {};
    MONTHS.forEach(function(mes, m) {
      var v = parsearValor(row[12 + m]);
      if (v > 0) byDim[dimKey][prog][mes] = (byDim[dimKey][prog][mes] || 0) + v;
    });
  });

  if (!Object.keys(byDim).length) return null;
  var results = {};
  Object.keys(byDim).forEach(function(dimKey) {
    var progs = byDim[dimKey];
    var progNames = Object.keys(progs).filter(function(p){
      return Object.keys(progs[p]).length > 0;
    });
    if (!progNames.length) return;
    var cats = progNames.map(function(l, i){
      return {key: slugify(l), label: l, color: COLORS[i % COLORS.length]};
    });
    var mesSet = {};
    progNames.forEach(function(p){
      Object.keys(progs[p]).forEach(function(m){ mesSet[m] = MONTHS.indexOf(m); });
    });
    var mesesOrd = MONTHS.filter(function(m){ return mesSet[m] !== undefined; });
    var data = mesesOrd.map(function(mes) {
      var row = {mes: mes, nro_mes: MONTHS.indexOf(mes)+1};
      cats.forEach(function(c, i){ row[c.key] = progs[progNames[i]][mes] || 0; });
      return row;
    });
    results[dimKey] = { data: data, cats: cats, presupuestoTotal: 0, kpiCards: {} };
  });
  return Object.keys(results).length ? results : null;
}

/* ── Parser global: un solo Excel → datos de todas las raíces ───────────── */
function parseExcelGlobal(buf, fileName) {
  var wb = XLSX.read(buf, {type:"array"});
  // Buscar hoja con "program" en el nombre, sino la primera
  var shName = wb.SheetNames.find(function(n){ return n.toLowerCase().includes("program"); })
             || wb.SheetNames[0];
  var ws = wb.Sheets[shName];
  var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  if (!rows.length) return null;

  // Fila 0: encabezado — columnas 0=Dimensión, 1=Programa, 2-13=meses
  var header = rows[0];
  var colMes = {}; // índice de columna → nombre mes normalizado
  header.forEach(function(h, i) {
    if (i < 2) return;
    var idx = normMes(h);
    if (idx >= 0) colMes[i] = MONTHS[idx];
  });

  // Agrupar datos: dimKey → progNombre → mesNombre → valor acumulado
  var byDim = {};
  rows.slice(1).forEach(function(row) {
    if (!row[0] || !row[1]) return;
    var dimRaw = String(row[0]).trim();
    var dimKey = DIMMAP[dimRaw.toLowerCase()
      .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")];
    if (!dimKey) return;
    var prog = String(row[1]).trim();
    if (!prog) return;

    if (!byDim[dimKey]) byDim[dimKey] = {};
    if (!byDim[dimKey][prog]) byDim[dimKey][prog] = {};

    Object.keys(colMes).forEach(function(ci) {
      var v = parsearValor(row[ci]);
      if (v > 0) {
        var mes = colMes[ci];
        byDim[dimKey][prog][mes] = (byDim[dimKey][prog][mes] || 0) + v;
      }
    });
  });

  if (!Object.keys(byDim).length) return null;

  var results = {};
  Object.keys(byDim).forEach(function(dimKey) {
    var progs = byDim[dimKey];
    // Filtrar programas sin ningún dato mensual
    var progNames = Object.keys(progs).filter(function(p){
      return Object.keys(progs[p]).length > 0;
    });
    if (!progNames.length) return;

    var cats = progNames.map(function(l, i){
      return {key: slugify(l), label: l, color: COLORS[i % COLORS.length]};
    });

    // Eje de meses: unión de todos los meses presentes
    var mesSet = {};
    progNames.forEach(function(p){
      Object.keys(progs[p]).forEach(function(m){ mesSet[m] = MONTHS.indexOf(m); });
    });
    var mesesOrd = MONTHS.filter(function(m){ return mesSet[m] !== undefined; });

    var data = mesesOrd.map(function(mes) {
      var row = {mes: mes, nro_mes: MONTHS.indexOf(mes)+1};
      cats.forEach(function(c, i){
        row[c.key] = progs[progNames[i]][mes] || 0;
      });
      return row;
    });

    var presupuestoTotal = progNames.reduce(function(s, p){
      return s + Object.keys(progs[p]).reduce(function(ss, m){ return ss + progs[p][m]; }, 0);
    }, 0);

    results[dimKey] = {
      data: data,
      cats: cats,
      presupuestoTotal: presupuestoTotal,
      kpiCards: {},
      fileName: fileName || shName,
    };
  });

  return Object.keys(results).length > 0 ? results : null;
}

/* ── Merge de todas las raíces para la vista general ───────────────────── */
function buildDataGeneral(datos, raices) {
  var mesSet = {};
  raices.forEach(function(raiz) {
    var d = datos[raiz.key];
    if (!d) return;
    d.data.forEach(function(row) { mesSet[row.mes] = row.nro_mes; });
  });
  var mesesOrd = Object.keys(mesSet).sort(function(a,b){ return mesSet[a]-mesSet[b]; });

  var dataRows = mesesOrd.map(function(mes) {
    var row = { mes: mes, nro_mes: mesSet[mes], __total: 0 };
    raices.forEach(function(raiz) {
      var d = datos[raiz.key];
      if (!d) { row[raiz.key] = 0; return; }
      var mesRow = d.data.find(function(r){ return r.mes === mes; });
      var suma = mesRow
        ? d.cats.reduce(function(s,c){ return s+(mesRow[c.key]||0); }, 0)
        : 0;
      row[raiz.key] = suma;
      row.__total += suma;
    });
    return row;
  });
  return dataRows;
}


/* ── Banda temporal de progreso anual ─────────────────────────── */
function TemporalBand({ datos, archivoCargado }) {
  var MES_HOY = 6;
  var MESES_LABEL = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  var pctAnio = Math.round((MES_HOY / 12) * 100);
  var ultimoMes = archivoCargado ? (function() {
    var last = 0;
    RAICES.forEach(function(r) {
      var d = datos[r.key];
      if (!d) return;
      d.data.forEach(function(row, i) {
        var tot = d.cats.reduce(function(s,c){ return s+(row[c.key]||0); }, 0);
        if (tot > 0 && (i+1) > last) last = i+1;
      });
    });
    return last;
  })() : 0;
  return (
    <div style={{background:"#fff", borderBottom:"1px solid rgba(90,122,40,.18)",
        padding:"7px 28px", display:"flex", alignItems:"center", gap:20, flexWrap:"wrap"}}>
      <div style={{display:"flex", alignItems:"center", gap:10, flex:1, minWidth:280}}>
        <div style={{fontSize:11, color:SLATE, fontWeight:700, letterSpacing:".04em",
            textTransform:"uppercase", flexShrink:0}}>
          Ejercicio 2026
        </div>
        <div style={{display:"flex", gap:2, alignItems:"flex-end"}}>
          {MESES_LABEL.map(function(m,i) {
            var past    = i+1 < MES_HOY;
            var current = i+1 === MES_HOY;
            return (
              <div key={m} title={m + " 2026"} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                <div style={{
                    width: current ? 26 : 18,
                    height: current ? 10 : 6,
                    borderRadius:3,
                    background: past ? GREEN : current ? LIME : "rgba(60,60,60,.12)",
                    boxShadow: current ? "0 0 0 2px rgba(157,196,98,.55)" : "none"
                }} />
                {current && (
                  <div style={{fontSize:8.5, color:GREEN, fontWeight:700}}>{m}</div>
                )}
              </div>
            );
          })}
        </div>
        <div style={{fontSize:10.5, color:SLATE, opacity:.7, flexShrink:0}}>
          Mes {MES_HOY} · {pctAnio}% del año
        </div>
      </div>
      {ultimoMes > 0 && (
        <div style={{fontSize:10.5, color:GREEN, fontWeight:700,
            background:"rgba(90,122,40,.1)", border:"1px solid rgba(90,122,40,.25)",
            padding:"2px 10px", borderRadius:10, flexShrink:0}}>
          Último dato: {MESES_LABEL[ultimoMes-1]}
        </div>
      )}
      <div className="temporal-hint" style={{fontSize:10.5, color:SLATE, opacity:.55, flexShrink:0}}>
        Clic en un área para ver el desglose mensual
      </div>
    </div>
  );
}

/* ── Mini histograma mensual (sparkline) ─────────────────────── */
function MiniHisto({ datos: areaData, color, height, width }) {
  var H = height || 28; var W = width || 120;
  if (!areaData) return <div style={{width:W, height:H}} />;
  var vals = areaData.data.map(function(row) {
    return areaData.cats.reduce(function(s,c){ return s+(row[c.key]||0); }, 0);
  });
  while (vals.length < 12) vals.push(0);
  var maxV = Math.max.apply(null, vals.concat([1]));
  var barW = Math.max(4, Math.floor((W - 11) / 12));
  var LABELS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:1,width:W,height:H,flexShrink:0}}
         title="Ejección mensual Ene→Dic 2026">
      {vals.map(function(v, i) {
        var h2 = v > 0 ? Math.max(3, Math.round((v / maxV) * H)) : 2;
        var isCurrent = i+1 === 6;
        var isFuture  = i+1 > 6;
        return (
          <div key={i}
               title={LABELS[i] + ": " + (v>0?("$"+Math.round(v/1e6)+"M"):"sin dato")}
               style={{
                  width: barW,
                  height: h2,
                  borderRadius:"2px 2px 0 0",
                  background: v === 0 ? "rgba(60,60,60,.12)"
                            : isCurrent ? LIME
                            : (color || GREEN),
                  opacity: isFuture ? 0.35 : 1,
                  flexShrink:0,
          }} />
        );
      })}
    </div>
  );
}

        ['Aporte Casa', 'Gastos de funcionamiento'],
      ];
      function resolveArea(prog) {
        if (areaMap[prog]) return areaMap[prog];
        for (var j=0; j<AREA_FALLBACK.length; j++) {
          if (prog.toLowerCase().includes(AREA_FALLBACK[j][0].toLowerCase())) return AREA_FALLBACK[j][1];
        }
        return '—';
      }
      // Reporte de avances — leer directo de PLAN B (cols: 0=área,1=programa,3=aprobado,4=prioritario,2=inversión,8=planB)
      const reporte = [];
      planB.slice(4).forEach(function(r) {
        const prog = normProg(r[1] ? String(r[1]).trim() : '');
        if (!prog || prog === 'Programa' || prog === 'Monto total de programas') return;
        const area      = normArea(r[0]) || resolveArea(prog);
        const aprobStr  = String(r[3] || '').toLowerCase().trim();
        const priorStr  = String(r[4] || '').toLowerCase().trim();
        const aprobado  = aprobStr === 'sí' || aprobStr === 'si';
        const prioritario = priorStr === 'sí' || priorStr === 'si';
        const inversion = typeof r[2] === 'number' ? r[2] : 0;
        const planBTotal= typeof r[8] === 'number' ? r[8] : 0;
        // Excluir líneas de gasto con $0 en ambos (son inciso presupuestarios sin asignación)
        if (inversion === 0 && planBTotal === 0) return;
        // Deduplicar: si ya existe el programa (por normProg), acumular montos
        const existing = reporte.find(function(x){ return x.programa === prog && x.area === area; });
        if (existing) {
          existing.inversion += inversion;
          existing.planB     += planBTotal;
          if (aprobado)    existing.aprobado    = true;
          if (prioritario) existing.prioritario = true;
          return;
        }
        reporte.push({
          programa: prog,
          area: area,
          prioritario: prioritario,
          aprobado: aprobado,
          inversion: inversion,
          planB: planBTotal,
        });
      });
      setReporteData(reporte);
    } catch(e) { console.error('Error al cargar Excel embebido:', e); }
  }, []);

    const abrirDetalle = key => {
    setRaizActiva(key);
    const d = datos[key];
    if (d) { const a={}; d.cats.forEach(c=>{a[c.key]=true;}); setActive(a); }
    setShowTotal(true);
    setVista("detalle");
  };

        </div>

          <IAlert s={12} c={RED}/> Supera la cuota mensual</div>}

    );

                          background: pi%2===0 ? "transparent" : `${GREEN}02`}}>
                        {/* Nombre + badge prioritario */}
                        <div style={{flex:1, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                          <span style={{fontSize:13.5, color:INK, lineHeight:1.3}}>
                            {row.programa}
                          </span>
                          {row.prioritario && (
                            <span style={{fontSize:10.5, fontWeight:700, fontFamily:HEAD,
                                color:"#8B5E00", background:"#FFF3CD",
                                border:"1px solid #F39C1260", padding:"1px 7px",
                                borderRadius:8, letterSpacing:".04em"}}>
                              PRIORITARIO
                            </span>
                          )}
                        </div>
                        {/* Badge aprobación */}
                        {row.aprobado ? (
                          <div className="prog-badge" style={{display:"inline-flex", alignItems:"center", gap:5, padding:"4px 12px", borderRadius:20, flexShrink:0,
                              background:"#27AE6018", border:"1px solid #27AE6040",
                              color:"#1a7a46", fontSize:12.5, fontWeight:700, fontFamily:HEAD}}>
                            <span style={{fontSize:14, lineHeight:1}}>✓</span> Aprobado
                          </div>
                        ) : (
                          <div className="prog-badge" style={{display:"inline-flex", alignItems:"center", gap:5, padding:"4px 12px", borderRadius:20, flexShrink:0,
                              background:"#E74C3C12", border:"1px solid #E74C3C35",
                              color:"#9b2b20", fontSize:12.5, fontWeight:700, fontFamily:HEAD}}>
                            <span style={{fontSize:14, lineHeight:1}}>○</span> Pendiente
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          );
        })()}
      </div>

      <div style={{padding:"0 28px 20px", fontSize:10.5, color:INK, opacity:.35, textAlign:"right"}}>
        Herramienta desarrollada por equipo de Planificación ER
      </div>
    </div>
  );

  /* ── VISTA DETALLE ───────────────────────────────────────────────────── */
  return (
    <div style={{background:CREAM, minHeight:"100vh", fontFamily:BODY, color:INK}}>
      <Header />
      <TemporalBand datos={datos} archivoCargado={archivoCargado}/>
      <div style={{padding:"24px 28px 36px"}}>

        {/* KPIs */}
        <div className="fade" style={{display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:14, marginBottom:20}}>
          {[
            { label:"Proyección total del ministerio", value: fmtARS(ejecutado), color: GREEN },
            { label:"Meses sobre la cuota",
              value: CUOTA>0 ? mesesSobreCuota+" de "+data.length : "—",
              sub:   CUOTA>0 ? "Cuota: "+fmtMill(CUOTA)+"/mes" : "Sin cuota configurada",
              color: mesesSobreCuota>0 ? RED : GREEN },
          ].map((k,i)=>(
            <div key={i} style={{background:"#fff", border:`1px solid ${GREEN}1f`, borderRadius:14, padding:"14px 16px"}}>
              <div style={{fontSize:11.5, color:INK, opacity:.65, marginBottom:6}}>{k.label}</div>
              <div style={{...NUM, fontFamily:HEAD, fontSize:19, fontWeight:700, color:k.color}}>{k.value}</div>
              {k.sub && <div style={{fontSize:11, color:INK, opacity:.45, marginTop:4}}>{k.sub}</div>}
            </div>
          ))}
        </div>
        {tendencia && (
          <div className="fade" style={{marginBottom:16, padding:"10px 16px", borderRadius:12,
              background: tendencia.up ? "#27AE6010" : "#E74C3C10",
              border: tendencia.up ? "1px solid #27AE6040" : "1px solid #E74C3C40",
              display:"flex", alignItems:"center", gap:10}}>
            <span style={{fontSize:22}}>{tendencia.up ? "📈" : "📉"}</span>
            <div>
              <div style={{fontFamily:HEAD, fontWeight:700, fontSize:13,
                  color: tendencia.up ? "#1a7a46" : "#9b2b20"}}>
                {tendencia.up ? "▲" : "▼"} {tendencia.pct}% respecto a {tendencia.prev}
              </div>
              <div style={{fontSize:11.5, color:SLATE, marginTop:2}}>
                Variación mensual en {tendencia.mes} vs mes anterior
              </div>
            </div>
          </div>
        )}

        {/* Toggles */}
        <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:14}}>
          <span style={{fontFamily:HEAD, fontSize:11, textTransform:"uppercase",
              letterSpacing:".12em", color:GREEN, fontWeight:700, marginRight:2}}>Programas</span>
          {cats.map(c => {
            const on = active[c.key];
            return (
              <button key={c.key} className="btn" onClick={()=>toggle(c.key)}
                style={{display:"inline-flex", alignItems:"center", gap:7, padding:"6px 12px",
                  borderRadius:20, border:`1.5px solid ${on?c.color:"#00000018"}`,
                  background:on?c.color:"#fff", color:on?"#fff":INK, fontSize:12, fontWeight:600}}>
                <span style={{width:14, height:14, borderRadius:4,
                    background:on?"#ffffff33":c.color,
                    display:"inline-flex", alignItems:"center", justifyContent:"center"}}>
                  {on && <ICheck s={10} c="#fff"/>}
                </span>
                {c.label}
              </button>
            );
          })}
          <span style={{width:1, height:22, background:"#00000015", margin:"0 2px"}} />
          <button className="btn" onClick={()=>setShowTotal(p=>!p)}
            style={{display:"inline-flex", alignItems:"center", gap:7, padding:"6px 12px",
              borderRadius:20, border:`1.5px solid ${showTotal?INK:"#00000018"}`,
              background:showTotal?INK:"#fff", color:showTotal?"#fff":INK, fontSize:12, fontWeight:600}}>
            <span style={{width:14, height:14, borderRadius:4,
                background:showTotal?"#ffffff33":INK,
                display:"inline-flex", alignItems:"center", justifyContent:"center"}}>
              {showTotal && <ICheck s={10} c="#fff"/>}
            </span>
            Total área
          </button>
        </div>

        {/* Gráfico */}
        <div className="fade" style={{background:"#fff", border:`1px solid ${GREEN}1f`,
            borderRadius:16, padding:"18px 14px 8px"}}>
          <ResponsiveContainer width="100%" height={400}>
            <LineChart data={data} margin={{top:16, right:28, left:14, bottom:4}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#0000000d" vertical={false}/>
              <XAxis dataKey="mes" tick={{fontSize:12, fill:INK, fontFamily:BODY}} tickLine={false} axisLine={{stroke:"#00000022"}}/>
              <YAxis tickFormatter={fmtMill} tick={{fontSize:11, fill:INK, fontFamily:BODY}} tickLine={false} axisLine={false} width={78} domain={[0,"auto"]}/>
              <Tooltip content={<Tip/>} cursor={{stroke:GREEN, strokeWidth:1, strokeDasharray:"4 4"}}/>
              {CUOTA>0 && (
                <ReferenceLine y={CUOTA} stroke={RED} strokeWidth={1.5} strokeDasharray="7 5"
                  label={{value:"Cuota · "+fmtMill(CUOTA), position:"insideTopRight",
                    fill:RED, fontSize:11, fontWeight:700, fontFamily:HEAD}}/>
              )}
              {cats.filter(c=>active[c.key]).map(c=>(
                <Line key={c.key} type="monotone" dataKey={c.key} name={c.label}
                  stroke={c.color} strokeWidth={2.2}
                  dot={{r:3, fill:c.color, strokeWidth:0}} activeDot={{r:5}} isAnimationActive/>
              ))}
              {showTotal && (
                <Line type="monotone" dataKey="__total" name="Total área"
                  stroke={INK} strokeWidth={3}
                  dot={({cx,cy,payload})=>{
                    if(cx==null||cy==null) return null;
                    const over=CUOTA>0&&payload.__total>CUOTA;
                    return <circle cx={cx} cy={cy} r={over?6:4} fill={over?RED:INK} stroke="#fff" strokeWidth={2}/>;
                  }}
                  activeDot={{r:7}} isAnimationActive/>
              )}
            </LineChart>
          </ResponsiveContainer>
        </div>

        {/* Alerta */}
        {mesesSobreCuota>0 && CUOTA>0 && (
          <div className="fade" style={{marginTop:14, display:"flex", alignItems:"flex-start", gap:11,
              background:"#fff", borderLeft:`4px solid ${RED}`, border:`1px solid ${RED}33`,
              borderRadius:12, padding:"13px 16px"}}>
            <IAlert s={20} c={RED}/>
            <div style={{fontSize:13, lineHeight:1.55}}>
              <strong style={{color:RED}}>{mesesSobreCuota} {mesesSobreCuota===1?"mes supera":"meses superan"} la cuota mensual. </strong>
              <span style={{color:INK, opacity:.85}}>
                {alertasSobre.map(d=>d.mes).join(", ")} exceden la cuota de {fmtMill(CUOTA)}/mes.
              </span>
            </div>
          </div>
        )}
      </div>
      <div style={{padding:"0 28px 20px", fontSize:10.5, color:INK, opacity:.35, textAlign:"right"}}>
        Herramienta desarrollada por equipo de Planificación ER
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
